<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Formichina</title>
  <meta name="description" content="Quanto puoi spendere oggi, senza collegare banca o carte. I dati restano sul tuo telefono.">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Formichina">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <span class="brand"><img src="logo.svg" alt="" class="brand-mark"><span id="topTitle">Formichina</span></span>
      <span id="syncDot" class="sync-dot" hidden title="Sincronizzazione"></span>
    </header>

    <main id="view" aria-live="polite"></main>

    <button id="fab" class="fab" data-action="add" aria-label="Aggiungi movimento">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <nav class="tabbar" aria-label="Sezioni">
      <button data-action="tab" data-tab="oggi" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        <span>Oggi</span></button>
      <button data-action="tab" data-tab="movimenti">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r=".8"/><circle cx="3.5" cy="12" r=".8"/><circle cx="3.5" cy="18" r=".8"/></svg>
        <span>Movimenti</span></button>
      <button data-action="tab" data-tab="piano">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/></svg>
        <span>Piano</span></button>
      <button data-action="tab" data-tab="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5h17"/><path d="M6.5 17v-5M12 17V7M17.5 17v-8"/></svg>
        <span>Statistiche</span></button>
      <button data-action="tab" data-tab="altro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        <span>Altro</span></button>
    </nav>
  </div>

  <dialog id="sheet" aria-label="Modulo"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="lock" class="lock" hidden></div>

  <noscript><p style="padding:24px">Formichina ha bisogno di JavaScript attivo.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
